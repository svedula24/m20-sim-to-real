# rslidar_sdk config for the Lynx M20 Pro's two RoboSense Airy units, consumed by tools/lidar/lidar_up.sh.
# Every value is the robot's own (its driver config on NOS, /opt/robot/share/node_driver/config/config.yaml), so this
# driver reads the same relayed streams the vendor's does. Points stay in the SENSOR frames (rslidar_front /
# rslidar_rear, ENABLE_TRANSFORM off in the build); TF carries the mounts (tools/nav/lidar_stage.sh --tf).
#
# host_address MUST be this computer's address on the robot subnet (armdog: 10.21.31.50). The multicast is relayed
# by NOS (source 10.21.31.106), not sent by the lidars; binding to the wrong interface yields silence with no error.
# use_lidar_clock false: the lidar clock follows NOS, whose clock read 2024 and sat 74,644,621 s behind armdog
# (measured 2026-10-30); stamps are this computer's receive time (receive minus stamp 0.108 s), the same clock Nav2
# and the cameras use.

common:
  msg_source: 1                   # 1 = live lidar over the network
  send_packet_ros: false
  send_point_cloud_ros: true

lidar:
  - driver:                       # FRONT: pitched -90 deg and yawed 180 (the rear is NOT yawed; it is the opposite
      lidar_type: RSAIRY          # of the obvious arrangement, see docs/REAL_ROBOT.md)
      host_address: 10.21.31.50
      group_address: 224.10.10.201
      msop_port: 6691
      difop_port: 7781
      imu_port: 6681
      user_layer_bytes: 0
      tail_layer_bytes: 0
      min_distance: 0.2
      max_distance: 60
      use_lidar_clock: false
      dense_points: true
      ts_first_point: true
      start_angle: 0
      end_angle: 360
      x: 0.32028
      y: 0
      z: -0.013
      roll: 0
      pitch: -1.57079
      yaw: -3.14159
    ros:
      ros_frame_id: rslidar_front
      ros_send_point_cloud_topic: /rslidar_points_front
      ros_send_packet_topic: /rslidar_packets_front
  - driver:                       # REAR
      lidar_type: RSAIRY
      host_address: 10.21.31.50
      group_address: 224.10.10.202
      msop_port: 6692
      difop_port: 7782
      imu_port: 6682
      user_layer_bytes: 0
      tail_layer_bytes: 0
      min_distance: 0.2
      max_distance: 60
      use_lidar_clock: false
      dense_points: true
      ts_first_point: true
      start_angle: 0
      end_angle: 360
      x: -0.32028
      y: 0
      z: -0.013
      roll: 0
      pitch: -1.57079
      yaw: 0
    ros:
      ros_frame_id: rslidar_rear
      ros_send_point_cloud_topic: /rslidar_points_rear
      ros_send_packet_topic: /rslidar_packets_rear
