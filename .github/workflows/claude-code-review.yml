name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    env:
      HAS_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}

    steps:
      # Without the secret the action fails the check on every PR. Skip with a notice instead: the review is advisory
      # and never a required check, so a missing credential must not turn CI red.
      - name: Check for the Claude credential
        if: env.HAS_OAUTH_TOKEN != 'true'
        run: |
          echo "::notice title=Claude Code Review skipped::No CLAUDE_CODE_OAUTH_TOKEN secret on this repository. Run /install-github-app in Claude Code, or: claude setup-token, then gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo ${{ github.repository }}"

      - name: Checkout repository
        if: env.HAS_OAUTH_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        if: env.HAS_OAUTH_TOKEN == 'true'
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true   # the review's transcript in the run log; without it a silent run cannot be diagnosed
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # The review also applies the "lean" rules (the ponytail review folded into this one, 2026-11-09), so one
          # review covers correctness, motion safety and bloat. The rules live here, in the prompt.
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            Then review the same diff for lean: after correctness and safety, every extra line is a cost. Flag code
            that should not exist or should be smaller: dead code and unused options; a helper the repo already has
            (name its path); stdlib or platform doing the job of new code or a new dependency; an abstraction, flag
            or config with one user or none; near-copies that must change together; a function mixing unrelated
            jobs. A `shortcut:` comment naming its ceiling and upgrade path is a decision, not a finding. Every finding
            needs a concrete failing case and the smallest fix, preferring deletion; no style taste, no "consider".
            Report each lean finding as an inline comment, and end the summary with a verdict (ship, or which findings
            first) and the lines that could go.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

